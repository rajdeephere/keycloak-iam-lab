server:
  port: 8081

spring:
  application:
    name: product-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring auto-discovers JWKS + validates issuer/signature/exp from this URI.
          # Canonical Keycloak URL is host.docker.internal:8085 so the token issuer
          # is identical from the host browser and from inside containers. Override
          # via KEYCLOAK_ISSUER_URI (compose sets it explicitly).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://host.docker.internal:8085/realms/demo}

# Custom app config: which audience THIS resource server will accept.
app:
  security:
    expected-audience: product-service

# Expose only health; keep the rest closed by default.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
