server:
  port: 8090

spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Single entry point. Requests are matched by path and proxied downstream.
      # The Authorization header is forwarded automatically -> the downstream
      # service receives the same bearer token (edge token pass-through).
      routes:
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/admin/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://host.docker.internal:8085/realms/demo}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
