services:
  postgres:
    image: postgres:16
    container_name: kc-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      # --- Admin bootstrap (Keycloak 26+ uses KC_BOOTSTRAP_ADMIN_*) ---
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # --- Database: production-style external Postgres, not the dev H2 ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # --- HTTP/hostname (relaxed for local dev only) ---
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      # Pin the public/frontend URL so the token issuer is IDENTICAL whether
      # Keycloak is reached from the host browser (localhost:8085) or from other
      # containers. host.docker.internal resolves on both sides (Docker Desktop),
      # so every party validates the same iss claim.
      KC_HOSTNAME: http://host.docker.internal:8085
    ports:
      - "8085:8080"
    volumes:
      # realm JSONs placed here are imported on first start (--import-realm)
      - ../realm-config:/opt/keycloak/data/import
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build: ../services/product-service
    container_name: product-service
    environment:
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8085/realms/demo
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak

  web-client:
    build: ../services/web-client
    container_name: web-client
    environment:
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8085/realms/demo
      # Reach the resource server by its compose service name on the shared network.
      PRODUCT_SERVICE_URL: http://product-service:8081
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
      - product-service

  order-service:
    build: ../services/order-service
    container_name: order-service
    environment:
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8085/realms/demo
      ORDER_SERVICE_SECRET: order-service-secret
      # Calls product-service (token relay + client credentials) by service name.
      PRODUCT_SERVICE_URL: http://product-service:8081
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
      - product-service

  gateway:
    build: ../services/gateway
    container_name: gateway
    environment:
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8085/realms/demo
      # Downstream routes resolved by compose service name.
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8083
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
      - product-service
      - order-service

volumes:
  pg_data:
